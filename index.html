            text: 'Q14. 普段のひとりエッチやセックスで、密かに感じている悩み・願望は？',
            options: [
                { text: 'なかなかイケない・不感症気味なので圧倒的な吸引力で強制的にイキたい', scores: { suction: 5, intense: 4, clit: 3 } },

        },
        {
            category: '最終チェック・理想の余韻',
            text: 'Q15. 最後に、このアイテムを使ったあと「どんな自分」になっていたいですか？',
            options: [
                { text: '「こんなの初めて…！」と新しい自分の性感帯に目覚めていたい', scores: { dual: 4, suction: 3, beginner: 3 } },

    let currentIdx = 0;
    let userAnswers = new Array(questions.length).fill(null);

    function renderQuestion() {
        const q = questions[currentIdx];
        document.getElementById('step-indicator').innerText = `Question ${currentIdx + 1} / ${questions.length}`;
        const percent = Math.round(((currentIdx + 1) / questions.length) * 100);
        document.getElementById('percent-indicator').innerText = `${percent}%`;
        document.getElementById('progress-fill').style.width = `${percent}%`;

        document.getElementById('q-category').innerText = q.category;
        document.getElementById('q-text').innerText = q.text;

        const optionsList = document.getElementById('options-list');
        optionsList.innerHTML = '';

        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => selectOption(idx);
            optionsList.appendChild(btn);
        });

        document.getElementById('back-btn').style.display = currentIdx > 0 ? 'inline-block' : 'none';
    }

    function selectOption(optionIndex) {
        userAnswers[currentIdx] = optionIndex;

        if (currentIdx < questions.length - 1) {
            currentIdx++;
            const area = document.getElementById('quiz-area');
            area.style.animation = 'none';
            area.offsetHeight; 
            area.style.animation = null;
            renderQuestion();
        } else {
            calculateAndShowResult();
        }
    }

    function prevQuestion() {
        if (currentIdx > 0) {
            currentIdx--;
            renderQuestion();
        }
    }

    function calculateAndShowResult() {
        const totalScores = {};
        userAnswers.forEach((optIdx, qIdx) => {
            if (optIdx !== null) {
                const scores = questions[qIdx].options[optIdx].scores;
                for (const [key, val] of Object.entries(scores)) {
                    totalScores[key] = (totalScores[key] || 0) + val;
                }
            }
        });

        const rankedProducts = products.map(product => {
            let matchScore = 0;
            let maxPossible = 0;

            for (const [trait, weight] of Object.entries(product.weights)) {
                const userVal = totalScores[trait] || 0;
                matchScore += userVal * weight;
                maxPossible += 15 * weight;
            }

            let rawPercent = Math.min(99, Math.max(72, Math.round((matchScore / (maxPossible * 0.55)) * 100)));
            return { ...product, matchScore, matchPercent: rawPercent };
        });

        rankedProducts.sort((a, b) => b.matchScore - a.matchScore);

        if (rankedProducts[0].matchPercent <= rankedProducts[1].matchPercent) {
            rankedProducts[0].matchPercent = Math.min(99, rankedProducts[1].matchPercent + 4);
        }
        if (rankedProducts[1].matchPercent <= rankedProducts[2].matchPercent) {
            rankedProducts[1].matchPercent = Math.max(75, rankedProducts[2].matchPercent + 3);
        }

        generateSummary(totalScores);

        const container = document.getElementById('ranking-container');
        container.innerHTML = '';

        const rankLabels = ['👑 第1位（運命のベストマッチ）', '🥈 第2位（相性抜群の対抗馬）', '🥉 第3位（新たな扉を開く一台）'];

        rankedProducts.slice(0, 3).forEach((item, index) => {
            const card = document.createElement('div');
            card.className = `rank-card rank-${index + 1}`;
            
            const tagsHtml = item.tags.map(t => `<span class="tag">#${t}</span>`).join('');

            card.innerHTML = `
                <div>
                    <span class="rank-badge">${rankLabels[index]}</span>
                    <span class="match-rate">マッチ度 ${item.matchPercent}%</span>
                </div>
                <h3 class="item-name">${item.name}</h3>
                <div class="item-catch">${item.catch}</div>
                <p class="item-desc">${item.desc}</p>
                <div class="tags-wrap">${tagsHtml}</div>
                <a href="${item.url}" target="_blank" class="shop-link-btn">公式サイトでこのアイテムを見る ↗</a>
            `;
            container.appendChild(card);
        });

        document.getElementById('quiz-section').style.display = 'none';
        document.getElementById('main-header').style.display = 'none';
        document.getElementById('result-section').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function generateSummary(scores) {
        let topTraits = Object.entries(scores).sort((a, b) => b[1] - a[1]).slice(0, 3).map(e => e[0]);
        let summaryText = '<strong>【あなたの深層フェムテック分析】</strong><br>';

        if (topTraits.includes('submissive') || topTraits.includes('thrill') || topTraits.includes('app')) {
            summaryText += 'あなたはただ気持ちよくなるだけでなく、<strong>「主導権を奪われるスリル」や「遠隔操作などの背徳感」</strong>に強く興奮するタイプ！スマホ連携やハンズフリー機能があるアイテムで、心の底からゾクゾクする体験がぴったりです。';
        } else if (topTraits.includes('tongue') || topTraits.includes('warm') || topTraits.includes('gentle')) {
            summaryText += 'あなたは機械的な激しい刺激よりも、<strong>「人肌のぬくもり」や「本物の舌のようなとろける愛撫」</strong>を求める繊細でロマンチストなタイプ。温感機能やリアルな舌舐め再現モデルが、あなたの心と体を優しく解きほぐします。';
        } else if (topTraits.includes('piston') || topTraits.includes('intense') || topTraits.includes('dual')) {
            summaryText += 'あなたは妥協のない強い快感や、<strong>「クリと中の2点同時責め・高速ピストン」</strong>で脳が真っ白になるような深いオーガズムを求める情熱的なタイプ！ハイパワー＆多機能なフラッグシップモデルが真価を発揮します。';
        } else {
            summaryText += 'あなたは自分のペースや安心感を大切にしながら、<strong>「ピンポイントで確実に高まれる心地よさ」</strong>を求めるスマートなタイプ。静音性や使いやすさに優れた吸引・ローター系アイテムが最高のパートナーになります。';
        }

        document.getElementById('personality-summary').innerHTML = summaryText;
    }

    function restartQuiz() {
        currentIdx = 0;
        userAnswers.fill(null);
        document.getElementById('result-section').style.display = 'none';
        document.getElementById('main-header').style.display = 'block';
        document.getElementById('quiz-section').style.display = 'block';
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderQuestion();
</script>
